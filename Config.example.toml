# Example configuration - copy to config.toml or similar and customize
[default.package]
name = "platform"
version = "0.1.0"

[default.otlp]
instance_id = "your-instance-name"          # e.g. "production-server-01"
collect_logs = true
collect_metrics = true
metrics_endpoint = "http://localhost:4318/v1/metrics"
logs_endpoint = "http://localhost:4318/v1/metrics"

[default]
environment = "local"                       # local | staging | production
log_directory = "./logs"
log_to_file = true
image_cache_directory = "./cache/images"